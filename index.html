<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>エージェント影山｜ゴホッ回避ミッション</title>
<link href="https://fonts.googleapis.com/css2?family=DotGothic16&display=swap" rel="stylesheet">
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
  html, body { height: 100%; background: #1d1f24; overflow: hidden; touch-action: none; }
  body { font-family: "DotGothic16", "Hiragino Sans", sans-serif; color: #2b2b2b; display: flex; align-items: center; justify-content: center; }
  #wrap { position: relative; height: 100%; max-height: 100vh; aspect-ratio: 9 / 16; max-width: 100vw; }
  canvas { display: block; width: 100%; height: 100%; background: #e9e3d6; }
  .screen { position: absolute; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; text-align: center; padding: 24px; background: rgba(29,31,36,.88); color: #f3eee2; }
  .hidden { display: none; }
  .tag { font-size: 13px; letter-spacing: .2em; color: #e2b04a; margin-bottom: 10px; }
  h1 { font-size: 30px; line-height: 1.25; margin-bottom: 16px; font-weight: normal; }
  h1 small { display: block; font-size: 15px; color: #c9c2b0; margin-top: 6px; }
  .brief { font-size: 14px; line-height: 1.8; background: rgba(255,255,255,.07); border: 1px dashed rgba(226,176,74,.6); padding: 14px 16px; margin-bottom: 22px; text-align: left; max-width: 300px; }
  .brief b { color: #e2b04a; font-weight: normal; }
  button { font-family: inherit; font-size: 20px; padding: 14px 34px; border: none; background: #e2b04a; color: #1d1f24; cursor: pointer; box-shadow: 0 4px 0 #9a7426; margin: 6px; }
  button:active { transform: translateY(3px); box-shadow: 0 1px 0 #9a7426; }
  button.sub { font-size: 15px; padding: 10px 20px; background: #f3eee2; box-shadow: 0 4px 0 #9b968a; }
  .big { font-size: 46px; color: #e2b04a; margin: 4px 0; }
  .rank { font-size: 22px; margin-bottom: 6px; }
  .note { font-size: 13px; color: #c9c2b0; margin-bottom: 18px; min-height: 1em; }
  .best { font-size: 13px; color: #c9c2b0; margin-top: 14px; }
  #toast { position: absolute; left: 50%; bottom: 30px; transform: translateX(-50%); background: #f3eee2; color: #1d1f24; padding: 8px 14px; font-size: 14px; opacity: 0; transition: opacity .3s; pointer-events: none; }
</style>
</head>
<body>
<div id="wrap">
  <canvas id="c"></canvas>

  <div id="title" class="screen">
    <div class="tag">TOP SECRET MISSION</div>
    <h1>ゴホッ回避ミッション<small>エージェント影山</small></h1>
    <div class="brief">
      冬の満員電車に潜入せよ。<br>
      乗客の<b>咳とくしゃみの飛沫</b>を<br>浴びずに、できるだけ長く生き残れ。<br><br>
      ・ドラッグ（矢印キー）で移動<br>
      ・<b>赤い扇形</b>＝もうすぐ飛んでくる<br>
      ・<b>マスク</b>を拾うと1回だけ防げる<br>
      ・3回浴びたら任務失敗
    </div>
    <button id="startBtn">任務開始</button>
    <div class="best" id="bestTitle"></div>
  </div>

  <div id="result" class="screen hidden">
    <div class="tag">MISSION REPORT</div>
    <div>生存時間</div>
    <div class="big" id="rTime">0.0秒</div>
    <div class="rank" id="rRank"></div>
    <div class="note" id="rNote"></div>
    <button id="retryBtn">もう一度潜入</button>
    <button id="shareBtn" class="sub">結果をコピー</button>
    <div class="best" id="rBest"></div>
  </div>

  <div id="toast"></div>
</div>

<script>
(() => {
  const W = 360, H = 640;
  const cv = document.getElementById('c');
  const ctx = cv.getContext('2d');

  function resize() {
    const r = cv.getBoundingClientRect();
    const dpr = Math.min(window.devicePixelRatio || 1, 3);
    cv.width = Math.round(r.width * dpr);
    cv.height = Math.round(r.height * dpr);
    ctx.setTransform(cv.width / W, 0, 0, cv.height / H, 0, 0);
  }
  window.addEventListener('resize', resize);
  resize();

  // ---------- storage ----------
  function loadBest() { try { return parseFloat(localStorage.getItem('kageyama_cough_best')) || 0; } catch (e) { return 0; } }
  function saveBest(v) { try { localStorage.setItem('kageyama_cough_best', String(v)); } catch (e) {} }

  // ---------- audio ----------
  let actx = null;
  function initAudio() {
    try { actx = actx || new (window.AudioContext || window.webkitAudioContext)(); if (actx.state === 'suspended') actx.resume(); } catch (e) { actx = null; }
  }
  function noiseBurst(t0, dur, freq, vol) {
    const len = Math.floor(actx.sampleRate * dur);
    const buf = actx.createBuffer(1, len, actx.sampleRate);
    const d = buf.getChannelData(0);
    for (let i = 0; i < len; i++) d[i] = Math.random() * 2 - 1;
    const src = actx.createBufferSource(); src.buffer = buf;
    const bp = actx.createBiquadFilter(); bp.type = 'bandpass'; bp.frequency.value = freq; bp.Q.value = 0.8;
    const g = actx.createGain();
    g.gain.setValueAtTime(0.0001, t0);
    g.gain.exponentialRampToValueAtTime(vol, t0 + 0.015);
    g.gain.exponentialRampToValueAtTime(0.0001, t0 + dur);
    src.connect(bp).connect(g).connect(actx.destination);
    src.start(t0); src.stop(t0 + dur + 0.02);
  }
  function sfxCough(sneeze) {
    if (!actx) return;
    try {
      const t = actx.currentTime;
      if (sneeze) { noiseBurst(t, 0.12, 1800, 0.25); noiseBurst(t + 0.16, 0.35, 900, 0.45); }
      else { noiseBurst(t, 0.12, 700, 0.35); noiseBurst(t + 0.15, 0.1, 600, 0.25); }
    } catch (e) {}
  }
  function sfxTone(f, dur, type, vol) {
    if (!actx) return;
    try {
      const t = actx.currentTime;
      const o = actx.createOscillator(); o.type = type || 'square'; o.frequency.value = f;
      const g = actx.createGain(); g.gain.setValueAtTime(vol || 0.08, t); g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
      o.connect(g).connect(actx.destination); o.start(t); o.stop(t + dur);
    } catch (e) {}
  }

  // ---------- game state ----------
  const SPOTS = [
    { x: 180, y: 86 }, { x: 26, y: 330 }, { x: 334, y: 470 }, { x: 72, y: 86 },
    { x: 334, y: 210 }, { x: 288, y: 86 }, { x: 26, y: 540 }
  ];
  const COAT = ['#6d7a8c', '#8a6f63', '#5f7f6a', '#7b6c8f', '#8c8467', '#64707a', '#9a6b6b'];

  let S = null;
  let state = 'title';
  let keys = {};

  function newGame() {
    S = {
      t: 0,
      p: { x: 180, y: 470, vx: 0, vy: 0 },
      hits: 0, invuln: 0, shield: false,
      coughers: SPOTS.map((s, i) => ({ ...s, i, active: false, st: 'idle', timer: 1 + Math.random(), aim: 0, sneeze: false, emit: 0, coat: COAT[i] })),
      parts: [], texts: [], splats: [],
      mask: null, maskTimer: 9,
      shake: 0, flash: 0, dodges: 0, coughs: 0
    };
  }

  function diff() { return Math.min(1, S.t / 90); }

  function aimAngle(c) {
    const dx = S.p.x - c.x, dy = S.p.y - c.y;
    return Math.atan2(dy, dx);
  }
  function range(c) { return (c.sneeze ? 330 : 250) * (1 + diff() * 0.35); }

  function update(dt) {
    S.t += dt;
    const P = S.p;

    // keyboard
    const sp = 230;
    let kx = (keys.ArrowRight || keys.d ? 1 : 0) - (keys.ArrowLeft || keys.a ? 1 : 0);
    let ky = (keys.ArrowDown || keys.s ? 1 : 0) - (keys.ArrowUp || keys.w ? 1 : 0);
    if (kx || ky) { const l = Math.hypot(kx, ky); P.x += kx / l * sp * dt; P.y += ky / l * sp * dt; }
    P.x = Math.max(56, Math.min(304, P.x));
    P.y = Math.max(150, Math.min(612, P.y));

    if (S.invuln > 0) S.invuln -= dt;
    if (S.shake > 0) S.shake -= dt;
    if (S.flash > 0) S.flash -= dt;

    // activate coughers
    const nActive = Math.min(SPOTS.length, 2 + Math.floor(S.t / 9));
    S.coughers.forEach((c, i) => {
      if (!c.active && i < nActive) { c.active = true; c.timer = 0.8; S.texts.push({ x: c.x, y: c.y - 40, s: '乗車', life: 1 }); }
    });

    const d = diff();
    for (const c of S.coughers) {
      if (!c.active) continue;
      c.timer -= dt;
      if (c.st === 'idle' && c.timer <= 0) {
        c.st = 'wind';
        c.sneeze = S.t > 22 && Math.random() < 0.18 + d * 0.2;
        c.windMax = (c.sneeze ? 1.15 : 0.95) - d * 0.35;
        c.timer = c.windMax;
        c.aim = aimAngle(c);
      } else if (c.st === 'wind') {
        // aim drifts slowly toward player during first half (feels alive), then locks
        if (c.timer > c.windMax * 0.55) {
          const target = aimAngle(c);
          let da = target - c.aim; while (da > Math.PI) da -= Math.PI * 2; while (da < -Math.PI) da += Math.PI * 2;
          c.aim += da * Math.min(1, dt * 4);
        }
        if (c.timer <= 0) {
          c.st = 'cough'; c.timer = c.sneeze ? 0.45 : 0.3; c.emit = c.sneeze ? 60 : 30;
          sfxCough(c.sneeze); S.coughs++;
          S.texts.push({ x: c.x, y: c.y - 44, s: c.sneeze ? 'ハックション!!' : 'ゴホッ!', life: 0.8, big: c.sneeze });
        }
      } else if (c.st === 'cough') {
        const n = Math.ceil(c.emit * dt / (c.sneeze ? 0.18 : 0.12));
        const spread = c.sneeze ? 0.55 : 0.32;
        const R = range(c);
        for (let k = 0; k < n && c.emit > 0; k++, c.emit--) {
          const a = c.aim + (Math.random() * 2 - 1) * spread;
          const v = R * (0.6 + Math.random() * 0.55) * 1.25;
          S.parts.push({ x: c.x + Math.cos(c.aim) * 12, y: c.y - 6 + Math.sin(c.aim) * 12, vx: Math.cos(a) * v, vy: Math.sin(a) * v, r: 2.5 + Math.random() * 4, life: 1.6 + Math.random() * 0.5, age: 0 });
        }
        if (c.timer <= 0) {
          c.st = 'idle';
          c.timer = (1.6 + Math.random() * 1.8) * (1 - d * 0.5);
          S.dodges++;
        }
      }
    }

    // particles
    const hitR = 12;
    for (const q of S.parts) {
      q.age += dt;
      const k = Math.exp(-1.25 * dt);
      q.vx *= k; q.vy *= k;
      q.x += q.vx * dt; q.y += q.vy * dt;
      if (!q.dead && S.invuln <= 0 && q.age < q.life * 0.85) {
        if (Math.hypot(q.x - P.x, q.y - (P.y - 6)) < hitR + q.r) { q.dead = true; onHit(); }
      }
    }
    S.parts = S.parts.filter(q => !q.dead && q.age < q.life);

    // mask
    S.maskTimer -= dt;
    if (!S.mask && !S.shield && S.maskTimer <= 0) {
      S.mask = { x: 70 + Math.random() * 220, y: 190 + Math.random() * 380, life: 6 };
    }
    if (S.mask) {
      S.mask.life -= dt;
      if (Math.hypot(S.mask.x - P.x, S.mask.y - P.y) < 26) {
        S.shield = true; S.mask = null; S.maskTimer = 14;
        S.texts.push({ x: P.x, y: P.y - 50, s: 'マスク装着', life: 1 });
        sfxTone(880, 0.12, 'square', 0.06); setTimeout(() => sfxTone(1320, 0.15, 'square', 0.06), 90);
      } else if (S.mask.life <= 0) { S.mask = null; S.maskTimer = 8; }
    }

    for (const t of S.texts) { t.life -= dt; t.y -= 18 * dt; }
    S.texts = S.texts.filter(t => t.life > 0);

    if (S.hits >= 3) endGame();
  }

  function onHit() {
    const P = S.p;
    if (S.shield) {
      S.shield = false; S.invuln = 0.8;
      S.texts.push({ x: P.x, y: P.y - 50, s: 'マスクが守った!', life: 1 });
      sfxTone(300, 0.15, 'triangle', 0.1);
      S.maskTimer = 12;
      return;
    }
    S.hits++; S.invuln = 1.3; S.shake = 0.3; S.flash = 0.25;
    for (let i = 0; i < 4; i++) S.splats.push({ dx: (Math.random() * 2 - 1) * 12, dy: -20 + Math.random() * 34, r: 2 + Math.random() * 2.5 });
    S.texts.push({ x: P.x, y: P.y - 50, s: ['うわっ…', 'かかった…', 'もうダメだ…'][Math.min(S.hits - 1, 2)], life: 1 });
    sfxTone(160, 0.25, 'sawtooth', 0.09);
    if (navigator.vibrate) { try { navigator.vibrate(80); } catch (e) {} }
  }

  // ---------- drawing ----------
  function drawBG() {
    // floor
    ctx.fillStyle = '#e9e3d6'; ctx.fillRect(0, 0, W, H);
    // aisle stripes
    ctx.fillStyle = '#e1dacb';
    for (let y = 130; y < H; y += 40) ctx.fillRect(48, y, 264, 20);
    // wall + windows
    ctx.fillStyle = '#c9d3d9'; ctx.fillRect(0, 0, W, 54);
    ctx.fillStyle = '#9fb3c0';
    for (let x = 14; x < W; x += 88) ctx.fillRect(x, 10, 70, 32);
    ctx.fillStyle = '#7d8b95'; ctx.fillRect(0, 52, W, 4);
    // straps
    ctx.strokeStyle = '#b8b1a2'; ctx.lineWidth = 2;
    ctx.beginPath(); ctx.moveTo(0, 60); ctx.lineTo(W, 60); ctx.stroke();
    for (let x = 30; x < W; x += 50) {
      ctx.beginPath(); ctx.moveTo(x, 60); ctx.lineTo(x, 70); ctx.stroke();
      ctx.beginPath(); ctx.arc(x, 76, 6, 0, Math.PI * 2); ctx.stroke();
    }
    // side seats
    ctx.fillStyle = '#7e8f6e';
    ctx.fillRect(0, 140, 10, 480); ctx.fillRect(W - 10, 140, 10, 480);
  }

  function drawCone(c) {
    const p = 1 - c.timer / c.windMax;
    const R = range(c);
    const spread = c.sneeze ? 0.55 : 0.32;
    ctx.save();
    ctx.globalAlpha = 0.12 + p * 0.25;
    ctx.fillStyle = c.sneeze ? '#d9472b' : '#e0613f';
    ctx.beginPath();
    ctx.moveTo(c.x, c.y - 6);
    ctx.arc(c.x, c.y - 6, R * (0.35 + p * 0.65), c.aim - spread, c.aim + spread);
    ctx.closePath(); ctx.fill();
    ctx.restore();
  }

  function drawCougher(c) {
    const wind = c.st === 'wind', cough = c.st === 'cough';
    const p = wind ? 1 - c.timer / c.windMax : 0;
    let bx = c.x, by = c.y;
    let lean = 0;
    if (wind) { lean = -Math.sin(p * Math.PI) * 4; bx += (Math.random() - 0.5) * p * 2; }
    if (cough) lean = 4;
    const fx = Math.cos(c.aim), fy = Math.sin(c.aim);
    ctx.save();
    ctx.translate(bx + fx * lean, by + fy * lean);
    // body
    ctx.fillStyle = c.coat;
    ctx.beginPath(); ctx.ellipse(0, 10, 15, 18, 0, 0, Math.PI * 2); ctx.fill();
    // head
    const red = wind ? p : cough ? 1 : 0;
    ctx.fillStyle = `rgb(${236 + red * 10 | 0},${206 - red * 70 | 0},${170 - red * 60 | 0})`;
    ctx.beginPath(); ctx.arc(0, -10, 12, 0, Math.PI * 2); ctx.fill();
    ctx.fillStyle = '#3a3330';
    ctx.beginPath(); ctx.arc(0, -13, 12, Math.PI * 1.05, Math.PI * 1.95); ctx.fill();
    // face toward aim
    const ex = fx * 5, ey = fy * 4;
    ctx.fillStyle = '#222';
    if (cough) {
      ctx.fillRect(-5 + ex, -12 + ey, 4, 1.5); ctx.fillRect(1 + ex, -12 + ey, 4, 1.5);
      ctx.beginPath(); ctx.ellipse(ex, -5 + ey, 3.5, 4, 0, 0, Math.PI * 2); ctx.fill();
    } else if (wind) {
      ctx.fillRect(-5 + ex, -12 + ey, 3, 1.5); ctx.fillRect(2 + ex, -12 + ey, 3, 1.5);
      ctx.fillRect(-2 + ex, -6 + ey, 4, 1.5);
    } else {
      ctx.beginPath(); ctx.arc(-3.5 + ex, -11 + ey, 1.4, 0, Math.PI * 2); ctx.arc(3.5 + ex, -11 + ey, 1.4, 0, Math.PI * 2); ctx.fill();
      ctx.fillRect(-2 + ex, -6 + ey, 4, 1.2);
    }
    ctx.restore();
    if (wind) {
      ctx.fillStyle = '#fff'; ctx.strokeStyle = '#333'; ctx.lineWidth = 1.5;
      const tx = c.x < 60 ? c.x + 22 : c.x > 300 ? c.x - 22 : c.x;
      ctx.font = '13px DotGothic16, sans-serif'; ctx.textAlign = 'center';
      const s = c.sneeze ? 'ハッ…ハッ…' : (p < 0.5 ? 'ゴ…' : 'ゴ…ゴ…');
      ctx.strokeText(s, tx, c.y - 30); ctx.fillText(s, tx, c.y - 30);
    }
  }

  function drawKageyama(x, y, opts = {}) {
    const blink = S && S.invuln > 0 && Math.floor(S.invuln * 12) % 2 === 0;
    if (blink) return;
    ctx.save(); ctx.translate(x, y);
    // shadow
    ctx.fillStyle = 'rgba(0,0,0,.12)';
    ctx.beginPath(); ctx.ellipse(0, 22, 15, 4, 0, 0, Math.PI * 2); ctx.fill();
    // legs
    ctx.fillStyle = '#4a4740'; ctx.fillRect(-7, 10, 5, 12); ctx.fillRect(2, 10, 5, 12);
    // jacket (tired beige)
    ctx.fillStyle = '#cbb48a';
    ctx.beginPath(); ctx.moveTo(-14, 12); ctx.lineTo(-11, -6); ctx.lineTo(11, -6); ctx.lineTo(14, 12); ctx.closePath(); ctx.fill();
    ctx.strokeStyle = '#a8916a'; ctx.lineWidth = 1; ctx.beginPath(); ctx.moveTo(0, -5); ctx.lineTo(0, 12); ctx.stroke();
    // shirt + loose tie
    ctx.fillStyle = '#f2efe6';
    ctx.beginPath(); ctx.moveTo(-4, -6); ctx.lineTo(4, -6); ctx.lineTo(0, 2); ctx.closePath(); ctx.fill();
    ctx.fillStyle = '#8c3b3b';
    ctx.beginPath(); ctx.moveTo(-1, -3); ctx.lineTo(3, -3); ctx.lineTo(4, 8); ctx.lineTo(1.5, 10); ctx.lineTo(0, 7); ctx.closePath(); ctx.fill();
    // head
    ctx.fillStyle = '#efd2b0';
    ctx.beginPath(); ctx.arc(0, -17, 12, 0, Math.PI * 2); ctx.fill();
    // messy hair
    ctx.fillStyle = '#3b3029';
    ctx.beginPath();
    ctx.moveTo(-13, -16);
    const tips = [[-14, -26], [-9, -24], [-8, -33], [-3, -27], [0, -34], [4, -27], [9, -32], [9, -24], [14, -27], [13, -16]];
    for (const [tx, ty] of tips) ctx.lineTo(tx, ty);
    ctx.quadraticCurveTo(6, -24, 0, -22); ctx.quadraticCurveTo(-7, -23, -13, -16);
    ctx.fill();
    // troubled brows + eyes
    ctx.strokeStyle = '#3b3029'; ctx.lineWidth = 1.4;
    ctx.beginPath(); ctx.moveTo(-7, -19); ctx.lineTo(-3, -21); ctx.moveTo(7, -19); ctx.lineTo(3, -21); ctx.stroke();
    ctx.fillStyle = '#222';
    ctx.beginPath(); ctx.arc(-4.5, -16, 1.4, 0, Math.PI * 2); ctx.arc(4.5, -16, 1.4, 0, Math.PI * 2); ctx.fill();
    // mouth / mask
    const shield = opts.shield ?? (S && S.shield);
    if (shield) {
      ctx.fillStyle = '#ffffff'; ctx.strokeStyle = '#b9c4cc'; ctx.lineWidth = 1;
      ctx.beginPath(); ctx.roundRect ? ctx.roundRect(-8, -14, 16, 9, 3) : ctx.rect(-8, -14, 16, 9); ctx.fill(); ctx.stroke();
      ctx.beginPath(); ctx.moveTo(-8, -12); ctx.lineTo(-12, -16); ctx.moveTo(8, -12); ctx.lineTo(12, -16); ctx.stroke();
    } else {
      ctx.strokeStyle = '#6b4a3a'; ctx.lineWidth = 1.2;
      ctx.beginPath(); ctx.moveTo(-3, -10); ctx.quadraticCurveTo(0, -12, 3, -10); ctx.stroke();
    }
    // sweat
    ctx.fillStyle = '#8fc6e8';
    ctx.beginPath(); ctx.ellipse(11, -22, 1.8, 3, 0.3, 0, Math.PI * 2); ctx.fill();
    // splats
    if (S) {
      ctx.fillStyle = 'rgba(150,190,90,.85)';
      for (const s of S.splats) { ctx.beginPath(); ctx.arc(s.dx, s.dy, s.r, 0, Math.PI * 2); ctx.fill(); }
    }
    ctx.restore();
  }

  function drawMask(m) {
    const bob = Math.sin(performance.now() / 200) * 2;
    const a = m.life < 1.5 ? (Math.floor(m.life * 8) % 2 ? 0.4 : 1) : 1;
    ctx.save(); ctx.globalAlpha = a; ctx.translate(m.x, m.y + bob);
    ctx.fillStyle = 'rgba(226,176,74,.25)'; ctx.beginPath(); ctx.arc(0, 0, 18, 0, Math.PI * 2); ctx.fill();
    ctx.fillStyle = '#fff'; ctx.strokeStyle = '#9aa8b2'; ctx.lineWidth = 1.2;
    ctx.beginPath(); ctx.rect(-10, -6, 20, 12); ctx.fill(); ctx.stroke();
    ctx.beginPath(); ctx.moveTo(-10, -3); ctx.lineTo(10, -3); ctx.moveTo(-10, 1); ctx.lineTo(10, 1); ctx.stroke();
    ctx.beginPath(); ctx.moveTo(-10, -5); ctx.quadraticCurveTo(-17, 0, -10, 5); ctx.moveTo(10, -5); ctx.quadraticCurveTo(17, 0, 10, 5); ctx.stroke();
    ctx.restore();
  }

  function drawHUD() {
    ctx.fillStyle = 'rgba(29,31,36,.82)'; ctx.fillRect(0, 0, W, 34);
    ctx.font = '16px DotGothic16, sans-serif'; ctx.textBaseline = 'middle';
    ctx.fillStyle = '#e2b04a'; ctx.textAlign = 'left';
    ctx.fillText('生存 ' + S.t.toFixed(1) + '秒', 10, 18);
    ctx.textAlign = 'right'; ctx.fillStyle = '#f3eee2';
    let s = '清潔度 ';
    for (let i = 0; i < 3; i++) s += i < 3 - S.hits ? '■' : '□';
    ctx.fillText(s, W - 10, 18);
    ctx.textBaseline = 'alphabetic';
  }

  function render() {
    ctx.save();
    if (S && S.shake > 0) ctx.translate((Math.random() - 0.5) * 8, (Math.random() - 0.5) * 8);
    drawBG();
    if (!S) { ctx.restore(); return; }
    for (const c of S.coughers) if (c.active && c.st === 'wind') drawCone(c);
    if (S.mask) drawMask(S.mask);
    // depth sort: draw coughers and player by y
    const ents = S.coughers.filter(c => c.active).map(c => ({ y: c.y, f: () => drawCougher(c) }));
    ents.push({ y: S.p.y, f: () => drawKageyama(S.p.x, S.p.y) });
    ents.sort((a, b) => a.y - b.y).forEach(e => e.f());
    // particles
    for (const q of S.parts) {
      const a = Math.max(0, 1 - q.age / q.life);
      ctx.fillStyle = `rgba(120,185,215,${0.35 + a * 0.55})`;
      ctx.beginPath(); ctx.arc(q.x, q.y, q.r, 0, Math.PI * 2); ctx.fill();
      ctx.fillStyle = `rgba(255,255,255,${a * 0.7})`;
      ctx.beginPath(); ctx.arc(q.x - q.r * 0.3, q.y - q.r * 0.3, q.r * 0.35, 0, Math.PI * 2); ctx.fill();
    }
    // texts
    ctx.textAlign = 'center';
    for (const t of S.texts) {
      ctx.globalAlpha = Math.min(1, t.life * 2);
      ctx.font = (t.big ? 20 : 15) + 'px DotGothic16, sans-serif';
      ctx.lineWidth = 4; ctx.strokeStyle = '#fff'; ctx.fillStyle = t.big ? '#c0392b' : '#2b2b2b';
      const x = Math.max(50, Math.min(W - 50, t.x));
      const y = Math.max(54, t.y);
      ctx.strokeText(t.s, x, y); ctx.fillText(t.s, x, y);
    }
    ctx.globalAlpha = 1;
    ctx.restore();
    if (S.flash > 0) { ctx.fillStyle = `rgba(150,190,90,${S.flash})`; ctx.fillRect(0, 0, W, H); }
    drawHUD();
  }

  // ---------- flow ----------
  const $ = id => document.getElementById(id);
  const RANKS = [
    [10, '濃厚接触者', 'まずは赤い扇形の外へ逃げよう'],
    [20, '見習いエージェント', '咳の向きは「ゴ…」の間に決まる'],
    [35, 'ソーシャル・ディスタンサー', 'くしゃみは範囲が広い。早めに離れろ'],
    [50, '飛沫の読み手', 'マスクは保険。拾える時に拾え'],
    [75, '無菌スパイ', 'ここまで来れば一流だ'],
    [Infinity, '伝説のエアロゾル回避者', '影山、お前は何者だ…']
  ];
  function rankOf(t) { return RANKS.find(r => t < r[0]); }

  let last = 0, raf = 0;
  function loop(ts) {
    const dt = Math.min(0.05, (ts - last) / 1000 || 0); last = ts;
    if (state === 'play') update(dt);
    render();
    raf = requestAnimationFrame(loop);
  }

  function startGame() {
    initAudio();
    newGame(); state = 'play';
    $('title').classList.add('hidden'); $('result').classList.add('hidden');
    sfxTone(660, 0.1); setTimeout(() => sfxTone(990, 0.15), 100);
  }

  let lastResult = null;
  function endGame() {
    state = 'over';
    const t = S.t;
    const best = loadBest();
    const isBest = t > best;
    if (isBest) saveBest(t);
    const r = rankOf(t);
    lastResult = { t, rank: r[1] };
    $('rTime').textContent = t.toFixed(1) + '秒';
    $('rRank').textContent = '称号「' + r[1] + '」';
    $('rNote').textContent = r[2];
    $('rBest').textContent = isBest ? '★ 自己ベスト更新！' : '自己ベスト ' + Math.max(best, t).toFixed(1) + '秒';
    setTimeout(() => $('result').classList.remove('hidden'), 500);
    sfxTone(220, 0.4, 'triangle', 0.1);
  }

  function toast(msg) {
    const el = $('toast'); el.textContent = msg; el.style.opacity = 1;
    clearTimeout(toast.t); toast.t = setTimeout(() => el.style.opacity = 0, 1600);
  }

  $('startBtn').addEventListener('click', startGame);
  $('retryBtn').addEventListener('click', startGame);
  $('shareBtn').addEventListener('click', async () => {
    if (!lastResult) return;
    const text = `【エージェント影山｜ゴホッ回避ミッション】\n満員電車で ${lastResult.t.toFixed(1)}秒 生き延びた\n称号「${lastResult.rank}」\n#エージェント影山 #ブラウザゲーム`;
    try { await navigator.clipboard.writeText(text); toast('コピーしました'); }
    catch (e) { toast('コピーできませんでした'); }
  });
  const b = loadBest(); if (b > 0) $('bestTitle').textContent = '自己ベスト ' + b.toFixed(1) + '秒';

  // pointer: relative drag
  let drag = null;
  function toLocal(e) { const r = cv.getBoundingClientRect(); return { x: (e.clientX - r.left) / r.width * W, y: (e.clientY - r.top) / r.height * H }; }
  cv.addEventListener('pointerdown', e => { if (state !== 'play') return; const l = toLocal(e); drag = { sx: l.x, sy: l.y, px: S.p.x, py: S.p.y, id: e.pointerId }; try { cv.setPointerCapture(e.pointerId); } catch (_) {} });
  cv.addEventListener('pointermove', e => {
    if (!drag || state !== 'play' || e.pointerId !== drag.id) return;
    const l = toLocal(e);
    S.p.x = drag.px + (l.x - drag.sx) * 1.3;
    S.p.y = drag.py + (l.y - drag.sy) * 1.3;
  });
  const endDrag = () => { drag = null; };
  cv.addEventListener('pointerup', endDrag); cv.addEventListener('pointercancel', endDrag);
  window.addEventListener('keydown', e => { keys[e.key] = true; if (e.key.startsWith('Arrow')) e.preventDefault(); if ((e.key === 'Enter' || e.key === ' ') && state !== 'play') startGame(); });
  window.addEventListener('keyup', e => { keys[e.key] = false; });

  // title preview: show a static scene
  newGame(); S.coughers.slice(0, 3).forEach(c => c.active = true);
  const preview = S;
  (document.fonts ? document.fonts.ready : Promise.resolve()).then(() => { resize(); });
  raf = requestAnimationFrame(loop);
  window.__game = { get S() { return S; }, get state() { return state; } };
})();
</script>
</body>
</html>
